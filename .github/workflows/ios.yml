name: iOS unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install && cd ios && pod install

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -workspace ios/iostest.xcworkspace \
            -scheme iostest \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/iostest.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/iostest.xcarchive/Products/Applications/iostest.app build/Payload/
          cd build && zip -qry iostest.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: iostest-ipa
          path: build/iostest.ipa
