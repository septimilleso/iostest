name: iOS unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      TAG: build-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install && cd ios && pod install

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -workspace ios/iostest.xcworkspace \
            -scheme iostest \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/iostest.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/iostest.xcarchive/Products/Applications/iostest.app build/Payload/
          cd build && zip -qry iostest.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: iostest-ipa
          path: build/iostest.ipa

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" build/iostest.ipa             --title "iostest $TAG"             --notes "Unsigned IPA from ${GITHUB_SHA::7}"             --target "$GITHUB_SHA"

      - name: Gitea release
        env:
          GITEA_URL: https://git.septimilleso.uk
          GITEA_REPO: septimilleso/iostest
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          if [ -z "$GITEA_TOKEN" ]; then echo "GITEA_TOKEN not set, skipping"; exit 0; fi
          API="$GITEA_URL/api/v1/repos/$GITEA_REPO"
          ID=$(curl -fsS -X POST "$API/releases"             -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json"             -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"$GITHUB_SHA\",\"name\":\"iostest $TAG\",\"body\":\"Unsigned IPA from ${GITHUB_SHA::7}\"}"             | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          curl -fsS -X POST "$API/releases/$ID/assets?name=iostest.ipa"             -H "Authorization: token $GITEA_TOKEN" -F "attachment=@build/iostest.ipa"
